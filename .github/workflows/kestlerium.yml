name: Kestlerium — avançar o mundo

# O terrário anda sozinho. Um tick são 30 minutos, então publicar a cada 30
# minutos significa publicar sempre o tick corrente: quem abre a página vê o
# agora, sem iniciar nada.
#
# O cron do GitHub atrasa com frequência — não importa. O mundo avança por
# TEMPO DECORRIDO desde a última execução, não por "uma execução = um tick".
# Se atrasar vinte minutos, ele recupera; se falhar uma vez, a seguinte alcança.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Escrever no repositório é como o estado sobrevive ao runner: o banco é
# commitado. Sem isso o mundo renasceria a cada meia hora.
permissions:
  contents: write

# Nunca duas execuções ao mesmo tempo — duas escritas concorrentes no mesmo
# banco produziriam dois mundos divergentes.
concurrency:
  group: kestlerium
  cancel-in-progress: false

jobs:
  avancar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Avançar o mundo e publicar a janela
        working-directory: kestlerium
        run: python3 run.py publicar --mundo vila

      - name: Commitar o estado
        run: |
          git config user.name  "Kestlerium"
          git config user.email "kestlerium@users.noreply.github.com"
          # O banco do mundo precisa ser versionado: é ele que carrega o estado
          # de uma execução para a próxima.
          git add -f kestlerium/out/mundo_vila.db public/kestlerium
          if git diff --cached --quiet; then
            echo "Nada mudou; o mundo já estava no tick corrente."
            exit 0
          fi
          git commit -m "Kestlerium: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          # Outra execução pode ter commitado enquanto esta rodava.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "Não consegui publicar depois de três tentativas." >&2
          exit 1
