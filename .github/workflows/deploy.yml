name: Deploy Archive to GitHub Pages

# Rebuilds and republishes the site on every push to main.
# Add, edit, rename or delete a Markdown file and push — the site follows.
on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab.
  workflow_dispatch:
  # Callable by another workflow in this repository.
  #
  # This exists because of a rule that is easy to miss: GitHub does NOT trigger
  # workflows from pushes made with the default GITHUB_TOKEN — it is how it
  # avoids infinite loops. The Kestlerium scheduler commits the advanced world
  # to main every 30 minutes, and none of those commits ever started a deploy,
  # so the published page froze at whatever the last human merge contained
  # while the repository kept moving. Calling this workflow directly is what
  # closes that gap, and needs no personal access token.
  workflow_call:

# Least-privilege permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # No history is exposed to the build.
          # Always build the tip of the default branch, never the SHA that
          # triggered the run. When the Kestlerium scheduler calls this
          # workflow, the caller's SHA is the commit from BEFORE it advanced the
          # world — checking that out would faithfully redeploy the stale page
          # this call exists to replace. For a plain push to main the tip is the
          # same commit or a newer one, which is what a site deploy wants
          # anyway.
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build
        env:
          # Derive the base path and host from the real repository name so the
          # site's asset URLs always match the (case-sensitive) Pages URL,
          # even if the repository is later renamed.
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_HOSTNAME: https://${{ github.repository_owner }}.github.io

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: GitHub Actions) if it was ever turned
          # off or reset — e.g. by a repository settings change — so a deploy
          # never silently no-ops again.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
