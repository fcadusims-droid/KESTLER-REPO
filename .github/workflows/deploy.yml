name: Deploy Archive to GitHub Pages

# Rebuilds and republishes the site on every push to main.
# Add, edit, rename or delete a Markdown file and push — the site follows.
on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab.
  workflow_dispatch:

# Least-privilege permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # No history is exposed to the build.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build
        env:
          # Derive the base path and host from the real repository name so the
          # site's asset URLs always match the (case-sensitive) Pages URL,
          # even if the repository is later renamed.
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_HOSTNAME: https://${{ github.repository_owner }}.github.io

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: GitHub Actions) if it was ever turned
          # off or reset — e.g. by a repository settings change — so a deploy
          # never silently no-ops again.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploys never overlap (see concurrency above), so any Pages deployment
      # still marked in progress here is stuck, and GitHub refuses every new
      # one until it is cancelled.
      - name: Cancel stuck Pages deployments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Pages names the blocking deployment by commit, so check the
          # recent commits on main and cancel whichever is still running.
          for sha in $(gh api "repos/$REPO/commits?sha=main&per_page=15" --jq '.[].sha'); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            if ! status=$(gh api "repos/$REPO/pages/deployments/$sha" --jq .status 2>&1); then
              # No Pages deployment for this commit; anything else is worth seeing.
              case "$status" in *"Not Found"*|*404*) continue ;; esac
              echo "::warning::Could not read Pages deployment $sha: $status"
            fi
            case "$status" in
              succeed|deployment_cancelled|deployment_failed|deployment_content_failed|deployment_attempt_error|deployment_lost) ;;
              *) echo "::warning::Cancelling stuck Pages deployment $sha ($status)"
                 out=$(gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" 2>&1) \
                   && echo "::notice::Cancelled $sha" \
                   || echo "::warning::Could not cancel $sha: $out"
                 sleep 10 ;;
            esac
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
